name: Initialize Cosmic Atlas source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.repository == 'hjsarker/cosmic-atlas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore authored source files from compressed handover
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const encoded = fs.readFileSync('.github/bootstrap.br64', 'utf8').trim();
          if (!/^[A-Za-z0-9+/=]+$/.test(encoded)) throw Error('Invalid source transfer');
          const bundle = zlib.brotliDecompressSync(Buffer.from(encoded,'base64'));
          fs.writeFileSync('/tmp/cosmic-atlas-source.tar',bundle);
          console.log('Validated and expanded',bundle.length,'bytes of authored source');
          NODE
          tar -tf /tmp/cosmic-atlas-source.tar | head -25
          tar -xf /tmp/cosmic-atlas-source.tar
          rm .github/bootstrap.br64
      - name: Commit complete readable source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish complete Cosmic Atlas 3D source, NASA data pipeline and tests"
          git push
